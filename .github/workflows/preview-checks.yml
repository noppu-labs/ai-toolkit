name: preview-checks

# Tests Cloudflare's preview of a pull request once Workers Builds has deployed
# it. The URL rules (dropping the trailing slash, _redirects, the preview-only
# X-Robots-Tag) are applied only by Cloudflare, so `astro preview` cannot test
# them.
#
# GitHub runs a check_run workflow only from the default branch, so this checks
# out the default branch's tests and never the PR's code. It reports as a commit
# status on the PR's head commit, because a check_run workflow's own check
# attaches to the default branch.

on:
  check_run:
    # Both, because Workers Builds may create its check run already completed, which GitHub reports as `created`.
    types: [created, completed]

permissions: {}

jobs:
  preview:
    name: Cloudflare preview checks
    # The slug must match the GitHub App that posts "Workers Builds: ai-toolkit".
    if: >-
      github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
      github.event.check_run.name == 'Workers Builds: ai-toolkit' &&
      github.event.check_run.conclusion == 'success' &&
      github.event.check_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    # Keyed on the commit rather than the pull request, so an older commit's
    # build that finishes late never cancels the run for the head commit. Runs
    # for one commit (a check run can arrive as both `created` and `completed`)
    # wait their turn, so none is cut short to post "cancelled".
    # On the job, so that other apps' check_run events, which the `if` skips,
    # never hold up a real run.
    concurrency:
      group: preview-${{ github.event.check_run.head_sha }}
      cancel-in-progress: false
    env:
      HEAD_SHA: ${{ github.event.check_run.head_sha }}
      STATUS_CONTEXT: Cloudflare preview checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Derive the preview URL
        env:
          DETAILS_URL: ${{ github.event.check_run.details_url }}
        run: |
          # Workers Builds links its check to the build; the branch's alias sits
          # between `previews/` and `/builds/`.
          if [[ ! "$DETAILS_URL" =~ /previews/([^/]+)/builds/ ]]; then
            echo "::error::No preview alias in the check's details URL"
            exit 1
          fi
          preview_alias="${BASH_REMATCH[1]}"
          if [[ ! "$preview_alias" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::The preview alias is not a hostname label"
            exit 1
          fi
          echo "PREVIEW_URL=https://${preview_alias}.toolkit.noppu.dev" >> "$GITHUB_ENV"
      - name: Post the pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=pending \
            -f context="$STATUS_CONTEXT" \
            -f description="running" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Test the preview
        id: tests
        # The job's own check attaches to the default branch, so a failing
        # preview must not fail the job. The final step reports this step's
        # outcome on the pull request's commit instead.
        continue-on-error: true
        env:
          EXPECTED_COMMIT: ${{ github.event.check_run.head_sha }}
          # Setup writes the commit the preview served here.
          PREVIEW_COMMIT_FILE: ${{ runner.temp }}/preview-commit
        run: npm run test:preview -w site
      # Runs on every outcome, so the pending status never outlives the job.
      - name: Post the final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          PREVIEW_COMMIT_FILE: ${{ runner.temp }}/preview-commit
        run: |
          state=failure
          description="failed"
          if [ "$JOB_STATUS" = "cancelled" ]; then
            description="cancelled"
          elif [ "$TESTS_OUTCOME" = "skipped" ]; then
            description="did not run: an earlier step failed"
          elif [ "$TESTS_OUTCOME" = "success" ]; then
            # The tests ran only if the preview served this commit, and
            # skipped if it served another. A skip is green only when that
            # commit is ahead of this one: an older, unrelated or unreadable
            # commit means this one went untested.
            description="preview serves another commit"
            preview_commit=$(cat "$PREVIEW_COMMIT_FILE" 2> /dev/null || true)
            if [[ "$preview_commit" =~ ^[0-9a-f]{40}$ ]]; then
              if [ "$preview_commit" = "$HEAD_SHA" ]; then
                state=success
                description="passed"
              elif [ "$(gh api "repos/$GITHUB_REPOSITORY/compare/$HEAD_SHA...$preview_commit" --jq .status 2> /dev/null)" = "ahead" ]; then
                state=success
                description="skipped: newer commit"
              fi
            fi
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context="$STATUS_CONTEXT" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
