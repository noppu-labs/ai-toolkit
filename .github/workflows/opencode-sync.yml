name: opencode-sync

# Once a day, syncs the OpenCode plugin pages from each plugin's npm release
# (`npm run sync:opencode -w site`) and opens a pull request from the
# chore/opencode-sync branch when anything changed. While that PR is open, each
# sync that changes something adds a commit on top, so commits pushed there by
# hand are kept. Once the PR is merged or closed, the next release starts a
# fresh branch from main.
#
# The plugin repos' files are untrusted input, so two jobs share the work.
# `sync` fetches and parses them with a read-only token and hands the result
# on as artifacts. `pr` holds the write token and only commits those files,
# pushes and calls gh, so the token never meets that input.
#
# GitHub holds the checks of a pull request opened with GITHUB_TOKEN until a
# maintainer approves them in the PR's Checks tab.
#
# `pr` needs the repository setting "Allow GitHub Actions to create and approve
# pull requests" (Settings > Actions > General) to be on.

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: opencode-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.run.outputs.changed }}
      exit: ${{ steps.run.outputs.exit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
      # Always succeeds: the sync's exit code goes to `result`, which runs
      # after `pr`.
      - name: Sync the plugins from their npm releases
        id: run
        run: |
          set -euo pipefail
          set +e
          npm run sync:opencode -w site -- --summary "$RUNNER_TEMP/opencode-sync.md"
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          status=$(git status --porcelain -- site/opencode-lock.json site/src/content/opencode)
          if [ -n "$status" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # An artifact is rooted at the deepest folder its paths share, so this
      # one holds opencode-lock.json and src/content/opencode/ from site/. The
      # summary in RUNNER_TEMP goes in an artifact of its own.
      - name: Upload the synced files
        if: steps.run.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opencode-sync
          path: |
            site/opencode-lock.json
            site/src/content/opencode/
          if-no-files-found: error
          retention-days: 1
      - name: Upload the summary
        if: steps.run.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opencode-sync-summary
          path: ${{ runner.temp }}/opencode-sync.md
          if-no-files-found: error
          retention-days: 1

  pr:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      # Unpacked outside the workspace, so the branch is chosen before the
      # synced files go in.
      - name: Download the synced files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opencode-sync
          path: ${{ runner.temp }}/opencode-sync
      - name: Download the summary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opencode-sync-summary
          path: ${{ runner.temp }}
      # A new commit on the open PR's branch is a fast-forward that touches
      # only the synced paths. Rebuilding the branch on main would hold its
      # checks for approval again whenever main moved, and GitHub can refuse
      # this token a push that carries main's workflow changes. The synced
      # folder is replaced whole, so files the sync removed stay removed;
      # `same=true` means there was nothing to commit.
      - name: Commit to the sync branch and open or update the PR
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=chore/opencode-sync
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          synced="$RUNNER_TEMP/opencode-sync"
          body="$RUNNER_TEMP/opencode-sync.md"
          state=$(gh pr view "$branch" --json state -q .state || true)
          if [ "$state" = "OPEN" ]; then
            git fetch origin "$branch"
            git switch -C "$branch" "origin/$branch"
          else
            if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
              git push "$remote" --delete "$branch"
            fi
            git switch -C "$branch"
          fi
          rm -rf site/src/content/opencode
          cp "$synced/opencode-lock.json" site/opencode-lock.json
          cp -R "$synced/src/content/opencode" site/src/content/opencode
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/opencode-lock.json site/src/content/opencode
          if git diff --cached --quiet; then
            echo "same=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(site): sync OpenCode plugin pages"
          printf '\n%s\n' "GitHub holds this PR's checks until a maintainer approves them: open the Checks tab and approve the workflows." >> "$body"
          git push "$remote" "$branch"
          if [ "$state" = "OPEN" ]; then
            gh pr edit "$branch" --body-file "$body"
          else
            gh pr create --base main --head "$branch" \
              --title "chore(site): sync OpenCode plugin pages" --body-file "$body"
          fi

  # A plugin that failed to sync turns the run red here, after the others'
  # update has reached the PR.
  result:
    needs: [sync, pr]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail when a plugin failed to sync
        if: needs.sync.outputs.exit != '0'
        run: |
          set -euo pipefail
          echo "::error::The sync failed for at least one plugin; see the sync job's log."
          exit 1
