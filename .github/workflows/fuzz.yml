name: fuzz

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly deep fuzz with 10x the per-PR run count.
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Fuzz property tests (fast-check, high run count)
        run: npm run fuzz
        env:
          FC_NUM_RUNS: ${{ github.event_name == 'schedule' && '10000' || '1000' }}
