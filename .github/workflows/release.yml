name: release

# Pushing plugin.json changes to main tags and releases each new plugin version
# (job `release`). A package.json change under packages/ does the same for a
# shared package, and shared packages are tagged, released and published first.
# Plugins that also ship an npm package (a package.json next to
# .claude-plugin/) are then built, tested, and published to npm under their
# scoped name, through OIDC trusted publishing: no npm token is stored
# anywhere. Manual dispatch retries the npm publish for an existing
# <name>@<version> tag without moving it. Re-runs are idempotent:
# name@version pairs already on npm are skipped.
#
# Prerequisites (configure once each, outside this repo):
#   - an npm trusted publisher for each npm package (plugin or shared), pointing at
#     GitHub Actions, repository noppu-labs/ai-toolkit, workflow
#     `release.yml`, no environment.
#   - Nothing in the repository settings: npm-publish-shared and
#     npm-publish request `id-token: write` in its own permissions, which OIDC publishing and
#     npm --provenance need.

on:
  push:
    branches: [main]
    paths:
      - "**/.claude-plugin/plugin.json"
      - "packages/*/package.json"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing <plugin>@<version> tag whose npm publish to retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # Push tags, create releases, and sign provenance attestations.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect unreleased plugin versions
        id: detect
        run: |
          set -euo pipefail
          # A glob with no match must expand to nothing, not to its own pattern.
          shopt -s nullglob
          mkdir -p dist
          : > dist/pending.txt
          for manifest in */.claude-plugin/plugin.json; do
            plugin="${manifest%%/*}"
            version=$(node -p "JSON.parse(require('fs').readFileSync('$manifest','utf8')).version ?? ''")
            if [[ -z "$version" ]]; then
              echo "::notice::$plugin has no version in plugin.json; skipping."
              continue
            fi
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::$plugin version '$version' is not x.y.z semver."
              exit 1
            fi
            tag="$plugin@$version"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag already released; skipping."
              continue
            fi
            tar -czf "dist/$plugin-$version.tgz" "$plugin"
            echo "$tag $plugin" >> dist/pending.txt
          done
          for manifest in packages/*/package.json; do
            name=$(basename "$(dirname "$manifest")")
            version=$(node -p "JSON.parse(require('fs').readFileSync('$manifest','utf8')).version ?? ''")
            if [[ -z "$version" ]]; then
              echo "::notice::$name has no version in package.json; skipping."
              continue
            fi
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::$name version '$version' is not x.y.z semver."
              exit 1
            fi
            tag="$name@$version"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag already released; skipping."
              continue
            fi
            tar -czf "dist/$name-$version.tgz" -C packages "$name"
            echo "$tag packages/$name" >> dist/pending.txt
          done
          echo "count=$(wc -l < dist/pending.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.detect.outputs.count != '0'
        with:
          node-version: 24
          cache: npm
      - name: Pre-publish validation
        if: steps.detect.outputs.count != '0'
        run: |
          npm ci --ignore-scripts
          npm run sync -- verify
          npm ci --ignore-scripts --prefix .github/tools
          npm run plugin:validate
      - name: Attest build provenance
        id: attest
        if: steps.detect.outputs.count != '0'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tgz
      - name: Tag and publish releases
        if: steps.detect.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while read -r tag dir; do
            plugin="${tag%@*}"
            version="${tag#*@}"
            # Extract this tarball's Sigstore bundle from the combined JSONL, matched by subject digest.
            digest=$(sha256sum "dist/$plugin-$version.tgz" | cut -d' ' -f1)
            bundle="dist/$plugin-$version.tgz.intoto.jsonl"
            : > "$bundle"
            while IFS= read -r line; do
              if echo "$line" | jq -r '.dsseEnvelope.payload' | base64 -d \
                | jq -e --arg d "$digest" 'any(.subject[]; .digest.sha256 == $d)' >/dev/null; then
                echo "$line" >> "$bundle"
              fi
            done < "$BUNDLE_PATH"
            if [[ ! -s "$bundle" ]]; then
              echo "::error::no attestation bundle matches $plugin-$version.tgz"
              exit 1
            fi
            prev=$(git tag -l "$plugin@*" --sort=-v:refname | head -1)
            if [[ -n "$prev" ]]; then
              git log "$prev..HEAD" --pretty='- %s (%h)' -- "$dir/" > notes.md
            else
              git log --pretty='- %s (%h)' -- "$dir/" > notes.md
            fi
            [[ -s notes.md ]] || echo "- Maintenance release" > notes.md
            if [[ "$dir" == packages/* ]]; then
              message="$plugin package $version"
            else
              message="$plugin plugin $version"
            fi
            git tag -a "$tag" -m "$message" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
            gh release create "$tag" --verify-tag --notes-file notes.md \
              "dist/$plugin-$version.tgz" "$bundle"
          done < dist/pending.txt

  npm-targets:
    name: select npm targets
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.select.outputs.targets }}
      shared: ${{ steps.select.outputs.shared }}
      plugins: ${{ steps.select.outputs.plugins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch --tags --force
      # Outputs: JSON arrays of {name, dir, tag, kind}. `targets` holds all of them, `shared` the
      # kind "shared" entries (packages/<name>), `plugins` the kind "plugin"
      # ones (<name>/). On push, a target qualifies when it has a package.json
      # and the tag for its current version (plugin.json for a plugin,
      # package.json for a shared package) points at this commit, i.e. the
      # release job just created it. On dispatch, the input tag. An empty
      # `targets` array skips the downstream jobs.
      - name: Select targets
        id: select
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          targets='[]'
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$INPUT_TAG" =~ ^[a-z0-9-]+@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::tag '$INPUT_TAG' is not <name>@<x.y.z>."
              exit 1
            fi
            if ! git rev-parse -q --verify "refs/tags/$INPUT_TAG^{commit}" >/dev/null; then
              echo "::error::tag '$INPUT_TAG' does not exist."
              exit 1
            fi
            name="${INPUT_TAG%@*}"
            if [[ -f "packages/$name/package.json" ]]; then
              dir="packages/$name"
              kind=shared
            elif [[ -f "$name/package.json" ]]; then
              dir="$name"
              kind=plugin
            else
              echo "::error::$name has no package.json."
              exit 1
            fi
            targets=$(jq -nc --arg name "$name" --arg dir "$dir" --arg tag "$INPUT_TAG" --arg kind "$kind" \
              '[{name: $name, dir: $dir, tag: $tag, kind: $kind}]')
          else
            for pkg in */package.json; do
              plugin="${pkg%%/*}"
              manifest="$plugin/.claude-plugin/plugin.json"
              [[ -f "$manifest" ]] || continue
              version=$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).version ?? ''" "$manifest")
              [[ -n "$version" ]] || continue
              tag="$plugin@$version"
              tag_sha=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)
              if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
                echo "$tag is not tagged at $GITHUB_SHA; skipping."
                continue
              fi
              targets=$(jq -c --arg name "$plugin" --arg tag "$tag" \
                '. + [{name: $name, dir: $name, tag: $tag, kind: "plugin"}]' <<< "$targets")
            done
            for pkg in packages/*/package.json; do
              name=$(basename "$(dirname "$pkg")")
              version=$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).version ?? ''" "$pkg")
              [[ -n "$version" ]] || continue
              tag="$name@$version"
              tag_sha=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)
              if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
                echo "$tag is not tagged at $GITHUB_SHA; skipping."
                continue
              fi
              targets=$(jq -c --arg name "$name" --arg dir "packages/$name" --arg tag "$tag" \
                '. + [{name: $name, dir: $dir, tag: $tag, kind: "shared"}]' <<< "$targets")
            done
          fi
          shared=$(jq -c 'map(select(.kind == "shared"))' <<< "$targets")
          plugins=$(jq -c 'map(select(.kind == "plugin"))' <<< "$targets")
          {
            echo "targets=$targets"
            echo "shared=$shared"
            echo "plugins=$plugins"
          } >> "$GITHUB_OUTPUT"
          echo "targets: $targets"

  npm-build:
    name: build ${{ matrix.target.name }}
    needs: npm-targets
    if: ${{ !cancelled() && needs.npm-targets.result == 'success' && needs.npm-targets.outputs.targets != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.npm-targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ matrix.target.tag }}
          persist-credentials: false
      # A plugin's tag, package.json and plugin.json must agree; a shared
      # package has no plugin.json.
      - name: Verify versions agree
        env:
          DIR: ${{ matrix.target.dir }}
          KIND: ${{ matrix.target.kind }}
          TAG: ${{ matrix.target.tag }}
        run: |
          set -euo pipefail
          pkg_version=$(node -p "require('./$DIR/package.json').version")
          tag_version="${TAG#*@}"
          if [[ "$pkg_version" != "$tag_version" ]]; then
            echo "::error::version mismatch: tag $tag_version, package.json $pkg_version."
            exit 1
          fi
          if [[ "$KIND" == "plugin" ]]; then
            plugin_version=$(node -p "require('./$DIR/.claude-plugin/plugin.json').version")
            if [[ "$plugin_version" != "$tag_version" ]]; then
              echo "::error::version mismatch: tag $tag_version, plugin.json $plugin_version."
              exit 1
            fi
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test
        run: npm test -- scripts/opencode-*.test.ts
      # A plugin's smoke test also installs the loader, so the loader is packed
      # too, into core-artifacts/ to keep artifacts/ at one tarball for upload.
      - name: Pack
        id: pack
        env:
          DIR: ${{ matrix.target.dir }}
          KIND: ${{ matrix.target.kind }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          (cd "$DIR" && npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/artifacts")
          set -- artifacts/*.tgz
          [ "$#" -eq 1 ] && [ -f "$1" ]
          echo "tarball=$PWD/$1" >> "$GITHUB_OUTPUT"
          core_tarball=""
          if [[ "$KIND" == "plugin" ]]; then
            mkdir -p core-artifacts
            (cd packages/opencode-toolkit-core && npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/core-artifacts")
            set -- core-artifacts/*.tgz
            [ "$#" -eq 1 ] && [ -f "$1" ]
            core_tarball="$PWD/$1"
          fi
          echo "core_tarball=$core_tarball" >> "$GITHUB_OUTPUT"
      # npm never lets a version be republished, so a version already on npm
      # must be byte-identical to this tag's tarball (npm pack is reproducible).
      # Otherwise the tag moved or the version was reused.
      - name: Verify tarball against npm
        env:
          DIR: ${{ matrix.target.dir }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./$DIR/package.json').name")
          version=$(node -p "require('./$DIR/package.json').version")
          published=$(npm view "$name@$version" dist.integrity 2>/dev/null || true)
          if [[ -z "$published" ]]; then
            echo "::notice::$name@$version is not on npm yet."
            exit 0
          fi
          local_integrity="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A)"
          if [[ "$published" != "$local_integrity" ]]; then
            echo "::error::$name@$version on npm differs from this tag's tarball"
            exit 1
          fi
          echo "$name@$version on npm matches this tag's tarball."
      # A plugin's loader range must resolve to a published version, or to one
      # this run publishes first (the shared jobs).
      - name: Check the loader dependency floor
        if: ${{ matrix.target.kind == 'plugin' }}
        env:
          DIR: ${{ matrix.target.dir }}
          SHARED: ${{ needs.npm-targets.outputs.shared }}
        run: |
          set -euo pipefail
          core="@noppu-labs/opencode-toolkit-core"
          range=$(node -p "require('./$DIR/package.json').dependencies?.['$core'] ?? ''")
          if [[ -z "$range" ]]; then
            echo "::error::$DIR/package.json does not depend on $core"
            exit 1
          fi
          # An unpublished package makes npm view fail (E404) or print nothing.
          published=$(npm view "$core@$range" version 2>/dev/null || true)
          if [[ -n "$published" ]]; then
            echo "$core@$range is published."
            exit 0
          fi
          # semver is not a direct dependency: take the copy bundled with npm,
          # else the one npm ci installed.
          npm_modules="$(npm root -g)/npm/node_modules"
          while read -r shared_version; do
            if node -e "
              const semver = require(require.resolve('semver', { paths: [process.argv[1], process.cwd()] }));
              process.exit(semver.satisfies(process.argv[2], process.argv[3]) ? 0 : 1);
            " "$npm_modules" "$shared_version" "$range"; then
              echo "$core@$shared_version satisfies $range and is published first in this run."
              exit 0
            fi
          done < <(jq -r --arg n "${core#*/}" '.[] | select(.name == $n) | .tag | sub("^[^@]*@"; "")' <<< "$SHARED")
          echo "::error::no published $core satisfies $range"
          exit 1
      - name: Smoke-test the tarball
        env:
          OPENCODE_PACKAGE_DIR: ${{ matrix.target.dir }}
          OPENCODE_TARBALL: ${{ steps.pack.outputs.tarball }}
          OPENCODE_CORE_TARBALL: ${{ steps.pack.outputs.core_tarball }}
        run: npm test -- scripts/opencode-package.test.ts
      - name: Tarball contents
        run: |
          set -euo pipefail
          echo "##[group]Tarball contents"
          tar -tzf artifacts/*.tgz | sort
          echo "##[endgroup]"
      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum ./*.tgz > checksums-sha256.txt
          cat checksums-sha256.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-${{ matrix.target.name }}
          path: artifacts/
          if-no-files-found: error

  # Shared packages (the loader) publish before any plugin, because a plugin's
  # dependency on it must resolve on npm when the plugin is installed.
  npm-publish-shared:
    name: publish ${{ matrix.target.name }}
    needs: [npm-targets, npm-build]
    if: ${{ !cancelled() && needs.npm-targets.result == 'success' && needs.npm-targets.outputs.shared != '[]' && needs.npm-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.npm-targets.outputs.shared) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ matrix.target.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Re-verify tag still points at this commit
        env:
          TAG: ${{ matrix.target.tag }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)" ]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-${{ matrix.target.name }}
          path: artifacts
      # The artifact must still match the checksum generated next to the build.
      - name: Verify artifact checksums
        working-directory: artifacts
        run: sha256sum --check checksums-sha256.txt
      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1. setup-node
      # installs the latest Node 24, whose bundled npm is new enough. npm
      # exchanges the job's OIDC token itself.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Publish the verified tarball. The guard lets a re-run skip a version
      # already on npm. There is no unscoped copy: npm rejects names too close
      # to an existing package, as it did `opencode-review`.
      - name: Publish to npm
        env:
          DIR: ${{ matrix.target.dir }}
        run: |
          set -euo pipefail
          set -- artifacts/*.tgz
          [ "$#" -eq 1 ]
          name=$(node -p "require('./$DIR/package.json').name")
          version=$(node -p "require('./$DIR/package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already on npm; skipping publish"
          else
            npm publish "./$1" --provenance --access public --tag latest
          fi

  npm-publish:
    name: publish ${{ matrix.target.name }}
    needs: [npm-targets, npm-build, npm-publish-shared]
    if: ${{ !cancelled() && needs.npm-targets.result == 'success' && needs.npm-targets.outputs.plugins != '[]' && needs.npm-build.result == 'success' && (needs.npm-publish-shared.result == 'success' || needs.npm-publish-shared.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.npm-targets.outputs.plugins) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ matrix.target.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Re-verify tag still points at this commit
        env:
          TAG: ${{ matrix.target.tag }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)" ]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-${{ matrix.target.name }}
          path: artifacts
      # The artifact must still match the checksum generated next to the build.
      - name: Verify artifact checksums
        working-directory: artifacts
        run: sha256sum --check checksums-sha256.txt
      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1. setup-node
      # installs the latest Node 24, whose bundled npm is new enough. npm
      # exchanges the job's OIDC token itself.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # The loader was published by the previous job, but the registry can lag
      # behind it, so retry before failing.
      - name: Wait for the loader dependency
        env:
          DIR: ${{ matrix.target.dir }}
        run: |
          set -euo pipefail
          core="@noppu-labs/opencode-toolkit-core"
          range=$(node -p "require('./$DIR/package.json').dependencies?.['$core'] ?? ''")
          if [[ -z "$range" ]]; then
            echo "::error::$DIR/package.json does not depend on $core"
            exit 1
          fi
          for attempt in $(seq 1 12); do
            published=$(npm view "$core@$range" version 2>/dev/null || true)
            if [[ -n "$published" ]]; then
              echo "$core@$range is published."
              exit 0
            fi
            echo "$core@$range not on npm yet (attempt $attempt/12)."
            sleep 10
          done
          echo "::error::no published $core satisfies $range"
          exit 1
      # Publish the verified tarball. The guard lets a re-run skip a version
      # already on npm. There is no unscoped copy: npm rejects names too close
      # to an existing package, as it did `opencode-review`.
      - name: Publish to npm
        env:
          DIR: ${{ matrix.target.dir }}
        run: |
          set -euo pipefail
          set -- artifacts/*.tgz
          [ "$#" -eq 1 ]
          name=$(node -p "require('./$DIR/package.json').name")
          version=$(node -p "require('./$DIR/package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already on npm; skipping publish"
          else
            npm publish "./$1" --provenance --access public --tag latest
          fi
