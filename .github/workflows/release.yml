name: release

# Pushing a `v*` tag builds and publishes the package with provenance, then
# creates checksums, an SBOM, and a GitHub Release. Manual dispatch retries an
# existing tag without moving it.
#
# The workflow is split so the job that installs dependencies and builds
# never holds write permissions: `build` only reads (and uploads the artifact
# plus its checksum), `publish` downloads the artifact, re-verifies its
# SHA-256 against the checksums produced next to the build, and only then
# publishes and creates the release.
#
# Prerequisites (configure once in repo settings):
#   - An npm trusted publisher for the package: GitHub Actions, this
#     repository, workflow `release.yml`, no environment, npm publish
#     allowed. The publish job authenticates through OIDC, so no npm token
#     is stored in the repository.
#   - Actions → General → "Workflow permissions" allows id-token writes
#     (required for OIDC publishing and npm --provenance).
#
# PENDING ADMINISTRATIVE STEP (not satisfiable by any change to this file):
#   protect the `v*` tags with a repository ruleset restricting tag
#   creation/update/deletion to maintainers (Rules → Rulesets → New branch
#   ruleset applied to `refs/tags/v*`, or:
#     gh api -X POST /repos/noppu-labs/ai-toolkit/rulesets -f ...
#   with restrictions=push for refs/tags/v*). A tag-triggered workflow can
#   never be its own root of trust: whoever controls the tagged commit
#   controls these guards, so tag protection must live outside the repo.
#
# Prereleases use next; legacy maintenance uses v1 without moving latest.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: review
        run: npm run build

      - name: Pack tarball
        working-directory: review
        run: npm pack

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: review.spdx.json
          working-directory: review

      - name: Generate checksums
        working-directory: review
        run: |
          sha256sum *.tgz > SHA256SUMS
          sha256sum *.spdx.json >> SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            review/*.tgz
            review/*.spdx.json
            review/SHA256SUMS

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Verify checksums
        run: |
          sha256sum -c SHA256SUMS

      - name: Publish to npm
        working-directory: review
        run: |
          npm publish --provenance --access=public *.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tgz
            *.spdx.json
            SHA256SUMS
          generate_release_notes: true
