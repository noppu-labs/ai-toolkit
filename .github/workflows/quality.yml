name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Biome
        run: npm run lint:biome-ci
      - name: Markdown lint
        run: npm run lint:md
      - name: Typecheck
        run: npm run typecheck
      - name: Site typecheck
        run: npm run typecheck -w site
      - name: Lock consistency
        run: npm run sync -- verify
      - name: Manifest sanity
        run: |
          node -e "
            const { readFileSync } = require('fs');
            JSON.parse(readFileSync('.claude-plugin/marketplace.json', 'utf8'));
            for (const p of ['laravel', 'inertia-react', 'review', 'investigate']) {
              const m = JSON.parse(readFileSync(p + '/.claude-plugin/plugin.json', 'utf8'));
              if (m.name !== p) throw new Error('plugin.json name mismatch: ' + p);
            }
          "
      # release.yml makes the same comparison in each plugin's npm build, but
      # by then the tag and the GitHub release already exist. A loader change
      # without a version bump fails here instead, on the pull request.
      - name: Loader matches its published version
        run: |
          set -euo pipefail
          core_dir=packages/opencode-toolkit-core
          name=$(node -p "require('./$core_dir/package.json').name")
          version=$(node -p "require('./$core_dir/package.json').version")
          published=$(npm view "$name@$version" dist.integrity 2>/dev/null || true)
          if [[ -z "$published" ]]; then
            echo "::notice::$name@$version is not on npm yet."
            exit 0
          fi
          local_integrity=$(cd "$core_dir" && npm pack --dry-run --json --ignore-scripts | jq -r '.[0].integrity')
          if [[ "$published" != "$local_integrity" ]]; then
            echo "::error::$core_dir differs from published $name@$version; bump its version, and patch-bump each plugin that depends on it"
            exit 1
          fi
          echo "$name@$version on npm matches the packed loader."
      - name: Plugin validation
        run: |
          npm ci --ignore-scripts --prefix .github/tools
          npm run plugin:validate
      - name: Site build
        run: npm run build -w site

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install Python tooling
        run: uv sync --locked --no-build
      - name: Python checks (ruff, ruff format, pyright at 3.8, codespell, bandit, complexipy)
        run: scripts/python-checks.sh
