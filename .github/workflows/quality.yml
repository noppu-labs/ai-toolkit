name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Biome
        run: npm run lint:biome-ci
      - name: Markdown lint
        run: npm run lint:md
      - name: Typecheck
        run: npm run typecheck
      - name: Site typecheck
        run: npm run typecheck -w site
      - name: Lock consistency
        run: npm run sync -- verify
      - name: Manifest sanity
        run: |
          node -e "
            const { readFileSync } = require('fs');
            JSON.parse(readFileSync('.claude-plugin/marketplace.json', 'utf8'));
            for (const p of ['laravel', 'inertia-react', 'review', 'investigate']) {
              const m = JSON.parse(readFileSync(p + '/.claude-plugin/plugin.json', 'utf8'));
              if (m.name !== p) throw new Error('plugin.json name mismatch: ' + p);
            }
          "
      - name: Plugin validation
        run: |
          npm ci --ignore-scripts --prefix .github/tools
          npm run plugin:validate
      - name: Site build
        run: npm run build -w site

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install Python tooling
        run: uv sync --locked --no-build
      - name: Python checks (ruff, ruff format, pyright at 3.8, codespell, bandit, complexipy)
        run: scripts/python-checks.sh
