name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Unit + property tests (with coverage)
        run: npm run coverage-ci
      - name: Report coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        with:
          name: "scripts coverage"
      # The site's Worker serves production traffic, so it has its own report
      # and the same thresholds; the root run above does not include site/.
      - name: Worker tests (with coverage)
        run: npm run coverage:worker -w site
      - name: Report Worker coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        with:
          name: "worker coverage"
          working-directory: site
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Comment-audit suite with the helper under Python 3.8 (its documented floor)
        # The helper's own tests call `python3` by name and lib.sh honours REVIEW_PYTHON, so a
        # python3 shim first on PATH puts every case on 3.8. The version check stops the step
        # from passing vacuously on the runner's default interpreter.
        run: |
          set -euo pipefail
          uv python install 3.8
          mkdir -p "$RUNNER_TEMP/py38"
          ln -s "$(uv python find --no-project 3.8)" "$RUNNER_TEMP/py38/python3"
          export PATH="$RUNNER_TEMP/py38:$PATH"
          python3 --version
          python3 --version | grep -q '^Python 3\.8\.'
          REVIEW_PYTHON="$RUNNER_TEMP/py38/python3" npm test -- scripts/review-scripts.test.ts
      - name: Install Playwright chromium
        run: npm run browsers:install -w site
      - name: Site tests
        run: npm run test -w site
