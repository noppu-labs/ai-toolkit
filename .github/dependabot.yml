version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The nightly 7.1.0-dev.* builds sort above -beta; ignore them until 7.1.0 ships.
      - dependency-name: typescript
        versions:
          - ">=7.1.0-dev.0 <7.1.0"
    groups:
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
          - vitest-browser-*
      astro:
        patterns:
          - astro
          - "@astrojs/*"
          - satteri
      # Groups are matched in order, so vitest and astro keep their own PRs.
      # Majors stay out of this group and arrive one per PR.
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /.github/tools
    schedule:
      interval: weekly
    groups:
      tools:
        patterns:
          - "*"
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-tooling:
        patterns:
          - "*"
