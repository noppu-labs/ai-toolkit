version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The nightly 7.1.0-dev.* builds sort above -beta; ignore them until 7.1.0 ships.
      - dependency-name: typescript
        versions:
          - ">=7.1.0-dev.0 <7.1.0"
    groups:
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
          - vitest-browser-*
      astro:
        patterns:
          - astro
          - "@astrojs/*"
  - package-ecosystem: npm
    directory: /.github/tools
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-tooling:
        patterns:
          - "*"
