# Nothing here is packaged or installed. This repo is an npm workspace; the one Python source
# is review/skills/comment-audit/scripts/python-comment-lines.py, a stdlib-only helper that
# runs on consumers' machines under whatever python3 they have, floor Python 3.8. A second
# Python location must be added to `include`/`paths` below, to `scripts=` in
# scripts/python-checks.sh, and to the `files:` patterns in .pre-commit-config.yaml.
# See CONTRIBUTING.md, "Before opening a pull request".
#
# `[project]` carries requires-python for the tooling venv; `package = false` keeps uv from
# building this directory.
[project]
name = "ai-toolkit"
version = "0"
# The floor for the *tooling* venv, not for the helper. For the helper's 3.8 floor, pyright at
# pythonVersion 3.8 catches annotations evaluated at runtime and syntax newer than 3.8; the
# tests.yml 3.8 run is the only guard for stdlib APIs. Ruff's target-version only stops
# pyupgrade from suggesting post-3.8 idioms.
requires-python = ">=3.12"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16",
    "pyright>=1.1.414",
    "codespell>=2.4",
    "bandit>=1.9",
    "complexipy>=8.0",
    "pre-commit>=4.6",
]

[tool.ruff]
line-length = 120
target-version = "py38"
include = ["review/skills/comment-audit/scripts/*.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade (at py38, so it never suggests a newer-only idiom)
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "BLE",  # blind except: every `except Exception` carries a `# noqa: BLE001 reason`
    "RUF",  # ruff-specific
    "C90",  # mccabe complexity (C901)
    "SLF",  # private member access
    "A",    # shadowing a builtin
    "PERF", # avoidable performance anti-patterns
    "ARG",  # unused arguments
    "RET",  # return mistakes
    "TRY",  # exception handling
    "FURB", # modern idioms
    "PTH",  # pathlib over os.path / open()
]
# ASYNC, DTZ, LOG, G and PT are left out: the helper has no async code, datetimes, logging or
# pytest tests.
# Two complexity limits on purpose: C901 counts branches, complexipy ([tool.complexipy]) weights
# nesting, and ruff has no cognitive-complexity rule.
mccabe.max-complexity = 10

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

# Pyright, not pyrefly: pyrefly 1.3.2 at python-version 3.8 reports nothing when
# `from __future__ import annotations` is removed, while pyright strict at 3.8 flags every
# `list[str]` and `X | Y` annotation that breaks the helper on 3.8.
[tool.pyright]
include = ["review/skills/comment-audit/scripts"]
pythonVersion = "3.8"
typeCheckingMode = "strict"

# Cognitive complexity. 15 is the SonarSource and complexipy default; 14 leaves one step of
# headroom. A deliberate exception is `# complexipy: ignore (reason)` on the def.
[tool.complexipy]
paths = ["review/skills/comment-audit/scripts"]
max-complexity-allowed = 14

[tool.codespell]
# `froms` is an awk array in lib.sh (the rename sources), not a misspelling of "forms".
ignore-words-list = "froms"

# Read only under `bandit -c pyproject.toml`. An accepted finding is `# <reason>  # nosec <ids>`:
# bandit reads every word after `nosec` as a test id.
[tool.bandit]
# B404 flags any `import subprocess`; the calls themselves are still checked (B603/B607).
skips = ["B404"]
