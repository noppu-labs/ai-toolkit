# The page for this plugin on toolkit.noppu.com: https://toolkit.noppu.com/plugins/laravel
# The fields are documented in docs/plugin-pages.md.
schemaVersion: 1
title: "laravel: Laravel backend skills"
seo:
  title: Laravel skills and backend agent for Claude Code
  description: >-
    Laravel skills for controllers, models, DTOs, policies, validation, testing and security, with
    a backend agent and rules you copy into your project.
tagline: >-
  Sixteen skills for Laravel backends, an agent that works through each backend task in a fixed
  order, and rules you copy into the project.
highlights:
  heading: What the laravel plugin gives a Laravel project.
  items:
    - label: layers
      title: Skills for each layer of a request
      body: >-
        `laravel-routing` and `laravel-controllers` cover the edge, `laravel-validation` and
        `laravel-dtos` the input, `laravel-services` external APIs, `laravel-models` and
        `laravel-query-builders` the data, `laravel-policies` access.
    - label: conventions
      title: Shared choices across the skills
      body: >-
        Controllers hold HTTP concerns only and call actions. Models use custom query builders
        for composable, type-hinted queries. A DTO wraps data that would otherwise be passed as
        several primitive values.
    - label: detection
      title: Testing and PHP advice that checks the project first
      body: >-
        `laravel-testing` reads `require-dev` and `tests/Pest.php` to pick Pest or PHPUnit syntax,
        prefers Pest when both are present, and asks you when it cannot tell. `php-best-practices`
        reads the PHP version from `composer.json` before suggesting syntax.
    - label: audit
      title: A security audit with a result per item
      body: >-
        `laravel-owasp-security` runs an OWASP Top 10 checklist over the codebase or the files you
        name, with React and Inertia checks added when it detects them. Each item is `PASS`,
        `FAIL` or `N/A`.
    - label: agent
      title: A backend agent that reads the skills first
      body: >-
        `laravel-backend-specialist` is told to activate the relevant skills before writing code,
        search the docs with the `search-docs` Boost tool, and inspect the schema before touching
        models. It generates files with `php artisan make:` and tests each change.
    - label: rules
      title: Rules that load only for matching files
      body: >-
        One rule covers Duster formatting and linting of PHP files, one container resolution in
        `app/Providers`, one test layout under `tests/`, and one DTO validation attributes in
        paths such as `app/**/Dtos`.
howItWorks:
  heading: What a backend task looks like.
  steps:
    - >-
      Each skill's description names the work it applies to, such as policies, permissions and
      ability checks for `laravel-policies`. After install the skills are namespaced, as in
      `laravel:laravel-dtos`.
    - >-
      For backend work the agent follows an order: activate relevant skills, search the docs,
      inspect the schema and sibling files, generate files with `artisan`, test, then run
      `vendor/bin/duster fix --dirty`.
    - >-
      When existing code breaks the separation of concerns, the agent follows the existing pattern
      and flags the problem briefly. It asks before changing dependencies or adding a top-level
      directory.
    - >-
      `/laravel:install-rules` copies the rule files into `.claude/rules/`. A file already there
      with identical content is skipped. One with different content is reported as a conflict,
      shown as a diff and left for you to decide.
    - >-
      Some rules embed project commands, such as `docker compose exec cli vendor/bin/duster`. After
      copying, the command lists them, asks whether they match your project and offers to adjust
      the copies.
requirements:
  items:
    - >-
      Claude Code with the marketplace added (`/plugin marketplace add noppu-labs/ai-toolkit`),
      then `/plugin install laravel@ai-toolkit`.
    - >-
      A Laravel project. The skills target Laravel 13, and three of them (`laravel-testing`,
      `laravel-owasp-security`, `laravel-database-optimization`) state PHP 8.3 or later.
    - >-
      Skills that cover a package are written for it: Spatie Laravel Data, `spatie/laravel-activitylog`
      v5, Saloon, Pest 4 or PHPUnit 12.
    - >-
      `laravel-backend-specialist` expects the Laravel Boost `search-docs` tool and is told to use
      it before implementing features.
    - >-
      The `code-quality-php` rule runs Duster through `docker compose exec cli`. Change that
      command if your project runs it another way.
faq:
  - q: Which Laravel and PHP versions do the skills target?
    a: >-
      Laravel 13. The agent's prompt names Laravel 13 and PHP 8.5, and `laravel-testing`,
      `laravel-owasp-security` and `laravel-database-optimization` state Laravel 13.x with PHP 8.3
      or later. `php-best-practices` covers PHP 8.0 to 8.5 and reads your version from
      `composer.json`. `laravel-models` marks which attributes need Laravel 12 and which need 13.
  - q: Which packages do the skills assume?
    a: >-
      `laravel-testing` covers Pest 4 and PHPUnit 12, `laravel-dtos` Spatie Laravel Data,
      `laravel-services` Saloon, `laravel-activity-logging` `spatie/laravel-activitylog` v5 and
      `laravel-quality` PHPStan and Pint. The agent's prompt also lists Inertia v3, Wayfinder,
      Larastan, Rector and Duster.
  - q: How do the rules get into my project?
    a: >-
      Run `/laravel:install-rules`. It copies four files into `.claude/rules/`, and each is scoped
      by path to the files it governs. The root README suggests reviewing the copies afterwards
      and adjusting project-specific commands such as the formatter invocation.
  - q: Does the laravel plugin work in OpenCode?
    a: >-
      There is no OpenCode package for it. The README lists OpenCode packages for `review` and
      `investigate` only. Outside the marketplace, it names `npx skills add
      noppu-labs/ai-toolkit/laravel` as the route for the skills.
  - q: How does it differ from the inertia-react plugin?
    a: >-
      `laravel` is the backend pack. `inertia-react` is the frontend pack, with 6 skills, a
      `frontend-developer` agent and 2 rules. The two meet in places: `laravel-owasp-security`
      adds React and Inertia checks when it detects them, and the agent follows Inertia v3
      patterns such as `Inertia::optional()`.
  - q: What does the OWASP audit report?
    a: >-
      One result per checklist item, `PASS`, `FAIL` or `N/A`. A `FAIL` gives the `file:line`, a
      description of the vulnerability and a fix recommendation. The skill tells the reviewer not
      to reproduce code, keys, tokens or `.env` contents from the file.
links:
  - label: Plugin directory on GitHub
    href: https://github.com/noppu-labs/ai-toolkit/tree/main/laravel
