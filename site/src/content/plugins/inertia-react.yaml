# The page for this plugin on toolkit.noppu.com: https://toolkit.noppu.com/plugins/inertia-react
# The fields are documented in docs/plugin-pages.md.
schemaVersion: 1
title: "inertia-react: Inertia and React frontend skills"
seo:
  title: Inertia and React skills for Claude Code
  description: >-
    Skills for Inertia pages, shadcn, Tailwind, React Query, Zustand, TypeScript and Vite, with a
    frontend agent and rules you copy into your project.
tagline: >-
  Have an agent write Inertia and React pages to the patterns your project already uses, with
  typed page props, forms built from shadcn parts and a browser-mode test beside each component
  it touches.
highlights:
  heading: What the inertia-react plugin gives a frontend.
  items:
    - label: inertia
      title: Inertia pages, forms and navigation
      body: >-
        `laravel-inertia-react` groups its rules by prefix, among them `page-`, `form-`, `nav-`,
        `shared-` and `layout-`. They run from typing page props and showing validation errors
        from `useForm` to partial reloads, flash messages and persistent layouts.
    - label: shadcn
      title: shadcn guidance that reads the project
      body: >-
        `shadcn` loads `npx shadcn@latest info --json`, the project config and installed
        components. Its critical rules include forms built from `FieldGroup` and `Field`, `flex`
        with `gap-*` in place of `space-y-*`, and a title on every `Dialog`, `Sheet` and `Drawer`.
    - label: tailwind
      title: Tailwind advice that checks the version first
      body: >-
        `tailwind-best-practices` checks `package.json` before advising, since v3 and v4 differ.
        An `@import "tailwindcss"` line or an `@theme {}` block points to v4, and a
        `tailwind.config.js` file points to v3.
    - label: state
      title: React Query and Zustand, with a persist warning
      body: >-
        `state-management` is written for TanStack Query v5 and Zustand v5. It says never to
        persist auth tokens, passwords or secrets to `localStorage` or `sessionStorage`, and to
        persist only non-sensitive state through `partialize`.
    - label: types
      title: Typed components and a faster Vite build
      body: >-
        `typescript-react-patterns` starts with props and hook types, then events, refs, generics,
        context and utility types. `react-vite-best-practices` starts with the build and code
        splitting, then the dev server, assets, environment variables and bundle analysis.
    - label: agent
      title: A frontend agent written around Inertia v3 and React 19
      body: >-
        `frontend-developer` assumes a Laravel 13 app on Inertia v3, React 19, TypeScript 6, Vite 8,
        Tailwind v4 and TanStack Table v8. It runs on the `sonnet` model and keeps project memory
        between sessions.
howItWorks:
  heading: What a frontend task looks like.
  steps:
    - >-
      Each skill's description lists the work it covers. `laravel-inertia-react` names page
      components and `useForm`, and `state-management` names `useQuery` and Zustand stores.
      Installed from the marketplace, the skills are namespaced, as in `inertia-react:shadcn`.
    - >-
      The agent builds URLs with Wayfinder route helpers and never by hand, validates forms with
      Zod on top of Inertia's `useForm`, sorts and pages tables on the server, and wraps UI that
      needs a permission in a gate component.
    - >-
      Before it reaches for a new library or hook, the agent looks at what `features/`, `hooks/`
      and `components/` already do, and it asks before creating a top-level folder.
    - >-
      Each new or changed component gets a `.test.tsx` and a `.stories.tsx`, with tests in
      Vitest 4 browser mode through `vitest-browser-react`. The agent finishes a task with
      `npm run format && npm run agent-checks`.
    - >-
      `/inertia-react:install-rules` copies the rule files into `.claude/rules/`. An identical
      file is skipped. A different one is reported as a conflict, shown as a diff and left to you.
    - >-
      `code-quality-ts` covers `resources/js/**/*.{ts,tsx}`, `.storybook/**/*.{ts,tsx}` and
      `*.config.ts`. `testing-vitest` covers `resources/js/**/*.test.{ts,tsx}`: `it` instead of
      `test`, a `describe` per function, tests beside the file, no React Testing Library.
requirements:
  items:
    - >-
      A frontend in `resources/js`, which is where the rules apply and where the agent looks for
      pages, hooks and components.
    - >-
      `format` and `agent-checks` npm scripts, which the agent and the `code-quality-ts` rule run
      at the end of a task. Change the copied rule if your scripts have other names.
    - >-
      For `shadcn`, a project with a `components.json`, which the skill reads through the shadcn
      CLI.
faq:
  - q: Which versions do the Inertia and React skills assume?
    a: >-
      `laravel-inertia-react` is written for Laravel 13.x on PHP 8.3 or later, and
      `tailwind-best-practices` for Tailwind v3.4 and later, v4 included. The agent is pinned to
      Inertia v3 and React 19.2, so it writes lazy props with `Inertia::optional()` and leaves out
      `Inertia::lazy()`, which v3 removed.
  - q: Does it need the laravel plugin?
    a: >-
      No. Each plugin installs on its own. The two do expect the same kind of app: the agent
      looks for pages under `resources/js/pages` that Laravel controllers return through
      `Inertia::render`.
  - q: How does it differ from the laravel plugin?
    a: >-
      `inertia-react` covers what runs in the browser: pages, forms, components, styling, client
      state and the Vite build. `laravel` covers the PHP side, from controllers and models to
      policies and tests. A Laravel and Inertia app can use both, with `frontend-developer` on
      `resources/js` and `laravel-backend-specialist` on the PHP.
  - q: Does the inertia-react plugin work in OpenCode?
    a: >-
      Not as a package, since only `review` and `investigate` have OpenCode packages. The skills
      CLI copies the skill folders alone, which leaves `frontend-developer` and the rules behind.
  - q: Where do the skills come from?
    a: >-
      `shadcn` comes from the `shadcn/ui` repository and the rest from `AsyrafHussin/agent-skills`,
      each copied in at a pinned upstream commit.
  - q: Is the frontend agent tied to one codebase?
    a: >-
      Partly. It was written around one app's layout and helpers: it expects a `useZodForm` hook,
      a shared `DataTable` with `useTableState`, and permission gates in
      `components/auth/PermissionGates.tsx`, none of which the plugin ships. In another project,
      expect to point it at your own equivalents or adjust it.
links:
  - label: Plugin directory on GitHub
    href: https://github.com/noppu-labs/ai-toolkit/tree/main/inertia-react
