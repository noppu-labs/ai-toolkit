<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>AI Toolkit — Agent skills for code review and investigation</title>
    <meta
      name="description"
      content="Agent skills for deep code review and grounded investigation in PHP, TypeScript, Python and beyond, plus dedicated Laravel and React packs."
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#fff4f9"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#2a2229"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Noppu Labs AI Toolkit" />
    <meta property="og:url" content="https://toolkit.noppu.com/" />
    <meta
      property="og:title"
      content="AI Toolkit — Agent skills for code review and investigation"
    />
    <meta
      property="og:description"
      content="Agent skills for deep code review and grounded investigation in PHP, TypeScript, Python and beyond, plus dedicated Laravel and React packs."
    />
    <meta
      property="og:image"
      content="https://toolkit.noppu.com/logo.png"
    />
    <meta property="og:image:width" content="900" />
    <meta property="og:image:height" content="900" />
    <meta
      property="og:image:alt"
      content="The AI Toolkit mascot: a pink axolotl"
    />
    <script>
      (() => {
        const stored = localStorage.getItem("theme");
        const dark =
          stored === "dark" ||
          ((stored === null || stored === "system") &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
